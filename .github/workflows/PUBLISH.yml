name: Publish on GitHub, Modrinth, CurseForge

on: [workflow_dispatch]

env:
  MINECRAFT_VERSION: 1.21.1
  JAVA_VERSION: 21
  VERSION: 1.0.0
  VERSION_TYPE: beta
  PUBLISH_GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
  PUBLISH_MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  PUBLISH_CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: "${{env.JAVA_VERSION}}"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-tag: "v${{env.VERSION}}"
          github-generate-changelog: false
          github-draft: false
          github-prerelease: false
          github-token: "${{env.PUBLISH_GITHUB_TOKEN}}"

          modrinth-id: QgrK9rtJ
          modrinth-featured: false
          modrinth-token: "${{env.PUBLISH_MODRINTH_TOKEN}}"

          curseforge-id: 1000148
          curseforge-token: "${{env.PUBLISH_CURSEFORGE_TOKEN}}"

          name: "Create: Addon Compatibility - v${{env.VERSION}} - Neoforge - ${{env.MINECRAFT_VERSION}}"
          version: "${{env.VERSION}}"
          version-type: "${{env.VERSION_TYPE}}"
          changelog-file: LATEST_CHANGELOG.md
          game-version-filter: releases

          loaders: neoforge

          files: "neoforge/build/libs/createaddoncompatibility-neoforge-${{env.MINECRAFT_VERSION}}-${{env.VERSION}}.jar"

          dependencies: |
            create(required){modrinth:create}{curseforge:328085}#(ignore:github)
            almostunified(required){modrinth:almost-unified}{curseforge:633823}#(ignore:github)
