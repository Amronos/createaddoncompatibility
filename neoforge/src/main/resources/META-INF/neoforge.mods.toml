modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/Amronos/${mod_id}/issues/"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
updateJSONURL="https://api.modrinth.com/updates/QgrK9rtJ/forge_updates.json"
displayURL="https://modrinth.com/mod/${mod_id}"
logoFile="logo.png"
credits="${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId="almostunified"
mandatory=true
versionRange="[${almostunified_version},)"
ordering="AFTER"
side="SERVER"
referralUrl="https://modrinth.com/mod/almost-unified"

[[dependencies.${mod_id}]]
modId="create"
mandatory=true
versionRange="[6.0.6,6.1.0)"
ordering="AFTER"
side="BOTH"
referralUrl="https://modrinth.com/mod/create"
